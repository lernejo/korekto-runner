name: Grade an exercise
run-name: Grade an exercise ${{ inputs.student-login }} / ${{ inputs.student-repo }}

on:
  workflow_dispatch:
    inputs:
      grader-repo:
        required: true
        description: Grader repository to checkout first
      student-login:
        required: true
        description: GitHub login of the student to grade
      student-repo:
        required: true
        description: Name of the repository to grade
      java-version:
        description: Version of Java to setup before running the grader
        default: '21'
      callback-url:
        required: true
        description: URL to send events to
      task-id:
        required: true
        description: Unique identifier of the running task
      grader-exec-v2:
        required: false
        description: Should use the new grader CLI
        default: 'false'
      public-repository:
        required: false
        type: boolean
        description: Student repository is public and does not require app token
        default: false

permissions:
  contents: read
  id-token: write

env:
  REPORT_PATH: /tmp/results.json
  METADATA_PATH: /tmp/metadata.json

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Assert all workflow tools are public
        if: ${{ inputs.public-repository }}
        run: |
          set -euo pipefail
          tools=(
            "actions/github-script"
            "actions/checkout"
            "actions/setup-java"
            "cli/cli"
            "jqlang/jq"
            "apache/maven"
          )

          for tool in "${tools[@]}"; do
            is_private="$(curl -fsSL "https://api.github.com/repos/$tool" | jq -r '.private')"
            if [ "$is_private" != "false" ]; then
              echo "❌ Tool repository is not public: $tool"
              exit 1
            fi
            echo "✅ Public tool repository: $tool"
          done

      - name: 🗝️ Generate Korekto app token
        if: ${{ !inputs.public-repository }}
        uses: actions/create-github-app-token@v1
        id: korekto-token
        with:
          app_id: ${{ vars.KOREKTO_APP_ID }}
          private_key: ${{ secrets.KOREKTO_APP_PRIVATE_KEY }}
          owner: ${{ inputs.student-login }}

      - name: 🔓 Use default token for public repository
        if: ${{ inputs.public-repository }}
        env:
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$FALLBACK_TOKEN" ]; then
            echo "❌ Missing fallback token for public repository mode"
            exit 1
          fi
          echo "::add-mask::$FALLBACK_TOKEN"
          echo "KOREKTO_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"

      - name: 🔐 Use app token for private repository
        if: ${{ !inputs.public-repository }}
        env:
          APP_TOKEN: ${{ steps.korekto-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "❌ Missing app token while public-repository is false"
            exit 1
          fi
          echo "::add-mask::$APP_TOKEN"
          echo "KOREKTO_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

      - name: Gather student metadata
        env:
          STUDENT_LOGIN: ${{ inputs.student-login }}
          STUDENT_REPO: ${{ inputs.student-repo }}
        run: |
          if [ -z "${KOREKTO_TOKEN:-}" ]; then
            echo "❌ Missing token for student metadata retrieval"
            exit 1
          fi
          export GH_TOKEN="$KOREKTO_TOKEN"
          gh api "https://api.github.com/repos/$STUDENT_LOGIN/$STUDENT_REPO/commits/main" \
            | jq '{commit_id: .sha, short_commit_id: .sha[:7], commit_url: .html_url}' > $METADATA_PATH

      - name: 📢 Send STARTED event
        uses: actions/github-script@v7
        env:
          CALLBACK_URL: ${{ inputs.callback-url }}
          STUDENT_LOGIN: ${{ inputs.student-login }}
          GRADER_REPO: ${{ inputs.grader-repo }}
          TASK_ID: ${{ inputs.task-id }}
        with:
          script: |
            const fs = require('fs');

            const token = await core.getIDToken();
            const {
              CALLBACK_URL,
              STUDENT_LOGIN,
              GRADER_REPO,
              TASK_ID,
              METADATA_PATH
            } = process.env;
            
            const metadata = JSON.parse(fs.readFileSync(METADATA_PATH));
            
            const payload = JSON.stringify({
              status: 'started',
              student_login: STUDENT_LOGIN,
              grader_repo: GRADER_REPO,
              task_id: TASK_ID,
              full_log_url: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              metadata: metadata
            }, null, 2);
            
            console.log(`Sending ${payload}`);
            
            const response = await fetch(CALLBACK_URL, {
              method: 'POST',
              body: payload,
              headers: {
                'Authorization': `bearer ${token}`,
                'Content-type': "application/json; charset=UTF-8"
              }
            });
            if (!response.ok) {
              const responseBody = await response.text();
              core.setFailed(`❌ Error sending start event: ${response.status} - ${responseBody}`);
            } else {
              core.info(`✅ Successfully sent start event: ${response.status} - ${response.statusText}`);
            }

      - name: ⬇️ Checkout Grader
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.grader-repo }}

      - name: ♨️ Setup Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: 💯 Grade, hoping for the best!
        if: ${{ inputs.grader-exec-v2 == 'false' }}
        run: |
          if [ -z "${KOREKTO_TOKEN:-}" ]; then
            echo "❌ Missing token for grader execution"
            exit 1
          fi
          mvn compile exec:java -Dexec.args="-s=$STUDENT_LOGIN -r=$REPORT_PATH" -Dgithub_token="$KOREKTO_TOKEN"
        env:
          STUDENT_LOGIN: ${{ inputs.student-login }}

      - name: 💯 Grade, hoping for the best! (v2)
        if: ${{ inputs.grader-exec-v2 == 'true' }}
        run: |
          if [ -z "${KOREKTO_TOKEN:-}" ]; then
            echo "❌ Missing token for grader execution"
            exit 1
          fi
          mvn compile exec:exec -Dgithub.login="$STUDENT_LOGIN" -Dgithub.token="$KOREKTO_TOKEN" -Dkorekto.report.path="$REPORT_PATH"
        env:
          STUDENT_LOGIN: ${{ inputs.student-login }}

      - name: 📬 Send result to server
        uses: actions/github-script@v7
        env:
          CALLBACK_URL: ${{ inputs.callback-url }}
          STUDENT_LOGIN: ${{ inputs.student-login }}
          GRADER_REPO: ${{ inputs.grader-repo }}
          TASK_ID: ${{ inputs.task-id }}
        with:
          script: |
            const fs = require('fs');
            
            const {
              CALLBACK_URL,
              STUDENT_LOGIN,
              GRADER_REPO,
              TASK_ID,
              METADATA_PATH,
              REPORT_PATH
            } = process.env;
            
            const metadata = JSON.parse(fs.readFileSync(METADATA_PATH));
            const result = JSON.parse(fs.readFileSync(REPORT_PATH));
            
            const token = await core.getIDToken();
            
            const response = await fetch(CALLBACK_URL, {
              method: 'POST',
              body: JSON.stringify({
                status: 'completed',
                student_login: STUDENT_LOGIN,
                grader_repo: GRADER_REPO,
                task_id: TASK_ID,
                full_log_url: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
                metadata: metadata,
                details: result.details
              }),
              headers: {
                'Authorization': `bearer ${token}`,
                'Content-type': "application/json; charset=UTF-8"
              }
            });
            
            if (!response.ok) {
              const responseBody = await response.text();
              core.setFailed(`❌ Error sending completed event: ${response.status} - ${responseBody}`);
            } else {
              core.info(`✅ Successfully sent completed event: ${response.status} - ${response.statusText}`);
            }

      - name: ❌ Send job failure to server
        if: ${{ failure() }}
        uses: actions/github-script@v7
        env:
          CALLBACK_URL: ${{ inputs.callback-url }}
          STUDENT_LOGIN: ${{ inputs.student-login }}
          GRADER_REPO: ${{ inputs.grader-repo }}
          TASK_ID: ${{ inputs.task-id }}
        with:
          script: |
            const fs = require('fs');
            
            const {
              CALLBACK_URL,
              STUDENT_LOGIN,
              GRADER_REPO,
              TASK_ID,
              METADATA_PATH
            } = process.env;
            
            const getMetadata = () => {
              try {
                return JSON.parse(fs.readFileSync(METADATA_PATH));
              } catch (error) {
                return {
                  commit_id: '<unknown>',
                  short_commit_id: '<unknown>',
                  commit_url: '<unknown>'
                }
              }
            };
            
            const metadata = getMetadata();
            const obj_body = {
              status: 'failure',
              student_login: STUDENT_LOGIN,
              grader_repo: GRADER_REPO,
              task_id: TASK_ID,
              full_log_url: `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              metadata: metadata
            };
            console.log(JSON.stringify(obj_body, null, 2));
            
            const token = await core.getIDToken();
            
            const response = await fetch(CALLBACK_URL, {
              method: 'POST',
              body: JSON.stringify(obj_body),
              headers: {
                'Authorization': `bearer ${token}`,
                'Content-type': "application/json; charset=UTF-8"
              }
            });
            
            if (!response.ok) {
              const responseBody = await response.text();
              core.setFailed(`❌ Error sending failure event: ${response.status} - ${responseBody}`);
            } else {
              core.info(`✅ Successfully sent failure event: ${response.status} - ${response.statusText}`);
            }
